name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No base filter: review incremental diffs in stacked PRs too.

permissions:
  contents: read

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  # Let an active review publish and clean up its session before the next run.
  cancel-in-progress: false

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify and build reviewer
        working-directory: .github/actions/jules-review
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
      - name: Check Jules configuration
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo '::error::Add the JULES_API_KEY repository secret. See docs/development/jules.md.'
            exit 1
          fi
      - name: Review and delete completed session
        uses: ./.github/actions/jules-review
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          timeout_minutes: 60
