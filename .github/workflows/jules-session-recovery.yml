name: Jules exact-session recovery
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR containing the trusted reviewer session reference
        type: string
        required: true
      session_id:
        description: Exact recorded session ID (no listing or bulk deletion)
        type: string
        required: true
      mode:
        type: choice
        options: [inspect, cleanup, respond]
        default: inspect
      include_review_artifact:
        description: Save only completed final reviewer text as an untrusted artifact; inspect mode only
        type: boolean
        default: false
      include_feedback_artifact:
        description: Save only pending agent message from AWAITING_USER_FEEDBACK; inspect mode only, mutually exclusive with review artifact
        type: boolean
        default: false
      expected_feedback_sha256:
        description: Respond only to this exact previously inspected question SHA-256
        type: string
        required: false
      reply_text:
        description: Manual review follow-up (respond mode only, max 8192 UTF-8 bytes; never logged)
        type: string
        required: false
concurrency:
  group: jules-session-recovery-${{ inputs.session_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build verified recovery code
        working-directory: .github/actions/jules-review
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build:recovery
      - name: Inspect or recover exact published session
        run: node .github/actions/jules-review/dist/recovery/index.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ inputs.pull_request }}
          SESSION_ID: ${{ inputs.session_id }}
          RECOVERY_MODE: ${{ inputs.mode }}
          INCLUDE_REVIEW_ARTIFACT: ${{ inputs.include_review_artifact }}
          INCLUDE_FEEDBACK_ARTIFACT: ${{ inputs.include_feedback_artifact }}
          EXPECTED_FEEDBACK_SHA256: ${{ inputs.expected_feedback_sha256 }}
          REPLY_TEXT: ${{ inputs.reply_text }}
      - name: Retain opt-in reviewer data for human inspection
        if: success() && (inputs.include_review_artifact || inputs.include_feedback_artifact) && inputs.mode == 'inspect'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jules-review-${{ inputs.session_id }}
          path: ${{ runner.temp }}/jules-review-recovery/
          if-no-files-found: error
          retention-days: 3
