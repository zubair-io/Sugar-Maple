name: Editor
on:
  workflow_call:
    outputs:
      validated_sha:
        description: Exact revision that passed the full Editor checks
        value: ${{ jobs.validated.outputs.sha }}
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s tools -p 'test_release_*.py'
      - run: bun tools/maple-inventory.ts
      - run: bun test src/web/tests
      - run: bun run --cwd src/web typecheck
      - run: bun run build:web
      - run: bun --bun src/web/node_modules/@playwright/test/cli.js install --with-deps chrome
      - run: bun run test:e2e
      - run: bun run test:library-preview
      - run: bun prototypes/library-preview/process-registry-test.ts
      - run: bun prototypes/library-preview/comparison-cancellation-test.ts
        timeout-minutes: 5

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s src/apple/ci_scripts -p 'test_*.py'
      - run: xcodebuild -version
      - run: bun run build:mac
        timeout-minutes: 10
      - name: Verify generated encryption metadata
        run: test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' 'build/DerivedData/Build/Products/Debug/Sugar Maple.app/Contents/Info.plist')" = false
      - run: bun tools/native-acceptance.ts
      - run: bun prototypes/library-preview/process-registry-test.ts
      - run: bun prototypes/library-preview/comparison-cancellation-test.ts --trust-native-fixture
        timeout-minutes: 5
      - run: bun --bun src/web/node_modules/@playwright/test/cli.js install chrome
      - run: bun prototypes/library-preview/server-owner-test.ts --trust-native-fixture
        timeout-minutes: 11
      - run: bun prototypes/library-preview/server-owner-test.ts --trust-native-fixture --scene
        timeout-minutes: 11
      - name: Retain isolated comparison diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-comparison-diagnostics
          path: |
            build/comparison-cancellation.json
            build/process-registry.json
            build/library-preview-comparison-final-acceptance.log
            build/library-scene-comparison-final-acceptance.log
            build/library-preview-server-owner.json
            build/library-scene-server-owner.json
          if-no-files-found: warn
          retention-days: 3

  validated:
    name: Editor validation
    needs: [web, macos]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
