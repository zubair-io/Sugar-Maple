@if (!node().hidden) {
  <div
    class="node"
    [class.selected]="selected() === node().id && !preview()"
    [ngStyle]="style()"
    [attr.data-node-id]="node().id"
    [attr.aria-label]="node().name"
    (pointerdown)="!preview() && pick.emit({ event: $event, node: node() })"
    (click)="preview() && activate.emit(node())"
  >
    @switch (node().kind) {
      @case ('text') {
        <span class="text">{{ node().text }}</span>
      }
      @case ('button') {
        <button class="authored" [tabIndex]="preview() ? 0 : -1">{{ node().text }}</button>
      }
      @case ('input') {
        <input
          class="authored"
          [placeholder]="node().text"
          [readOnly]="!preview()"
          [tabIndex]="preview() ? 0 : -1"
        />
      }
      @case ('image') {
        <img [src]="node().asset" [alt]="node().name" draggable="false" />
      }
      @case ('path') {
        <svg width="100%" height="100%" [attr.viewBox]="node().viewBox" preserveAspectRatio="none">
          <path
            [attr.d]="node().pathData"
            [attr.fill]="node().fill"
            [attr.stroke]="node().stroke"
            [attr.stroke-width]="node().strokeWidth"
          />
        </svg>
      }
      @case ('ellipse') {
        <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
          <ellipse cx="50" cy="50" rx="50" ry="50" [attr.fill]="node().fill" />
        </svg>
      }
    }
    @for (child of children(); track child.id) {
      <scene-node
        [node]="child"
        [document]="document()"
        [selected]="selected()"
        [preview]="preview()"
        (pick)="pick.emit($event)"
        (activate)="activate.emit($event)"
      />
    }
  </div>
}
